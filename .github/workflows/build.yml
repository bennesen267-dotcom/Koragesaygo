
name: Build Yataboes

on:
  workflow_dispatch:
  push:
    paths:
      - 'yataboes.zip'
      - '.github/workflows/build.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download project
        uses: actions/checkout@v4

      - name: Extract ZIP
        run: python3 -m zipfile -e yataboes.zip .

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Gradle
        run: |
          curl -fL https://services.gradle.org/distributions/gradle-8.6-bin.zip -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /tmp

      - name: Fix Fabric Loom
        run: |
          sed -i 's/1.4-SNAPSHOT/1.6.12/g' yataboes/build.gradle

      - name: Build JAR
        run: |
          cd yataboes
          /tmp/gradle-8.6/bin/gradle build --no-daemon

      - name: Upload JAR
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Yataboes-JAR
          path: yataboes/build/libs/*.jar
          if-no-files-found: error
